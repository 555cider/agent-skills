name: split-skills

# Each directory under skills/ is published as its own branch named
# split/<skill-name>, containing only that skill's history. install.sh clones
# that split branch for normal installs; before a new split branch exists, it
# can sync the local skills/<name>/ checkout for maintainer testing.
#
# On every push to main that touches skills/, this workflow runs `git subtree
# split` for each skill whose files changed and force-pushes the result (every
# skill on a manual run or a force-push). The split branches are derived
# artifacts — never commit to them directly.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/**'
      - '.claude-plugin/**'
      - 'hooks/**'
      - 'install.sh'
      - 'uninstall.sh'
      - '.github/workflows/split.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'tests/**'
      - '.claude-plugin/**'
      - 'hooks/**'
      - 'install.sh'
      - 'uninstall.sh'
      - '.github/workflows/split.yml'
  workflow_dispatch:

# Read-only by default. Only the split job, which force-pushes split/<name>, gets write access.
permissions:
  contents: read

# Runs are grouped per event and ref, so a pull request can never cancel or queue behind a
# push to main. Superseded pull request runs are cancelled; main runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Agent Skills validator
        run: python -m pip install 'skills-ref==0.1.1'
      - name: Validate skill packages and eval assets
        run: |
          set -euo pipefail
          for manifest in skills/*/SKILL.md; do
            agentskills validate "$(dirname "$manifest")"
          done
          python3 tests/validate-skill-evals.py
      - name: Validate Claude Code plugin manifests
        run: python3 tests/validate-plugin-manifests.py
      # The suites the portability matrix runs (and tests/install.sh) are left to it,
      # which covers Ubuntu as well.
      - name: Run the remaining deterministic regression suites
        run: |
          set -euo pipefail
          for suite in skills/*/tests/run.sh; do
            case "$suite" in
              skills/agent-memory/*|skills/peer-review/*|skills/shrink-test-input/*|skills/step-back/*|skills/worktree-cycle/*) continue ;;
            esac
            bash "$suite"
          done
      - name: Check shared copies are in sync
        run: |
          set -euo pipefail
          if [ -f tests/check-shared-copies.sh ]; then
            bash tests/check-shared-copies.sh
          else
            echo "tests/check-shared-copies.sh not present; skipping"
          fi

  # The shell tooling is used on every OS, and each one breaks it differently: macOS ships
  # /bin/bash 3.2 (empty arrays under set -u, no GNU sed), Windows runs it through Git Bash
  # (paths, file locking, the python3 Store stub). Run the shell suites everywhere, and
  # agent-memory's, whose hooks and .cmd shim run on every prompt on each of them.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provide python3 on Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          if ! python3 -c 'import sys' 2>/dev/null; then
            shim="$RUNNER_TEMP/python3-shim"
            mkdir -p "$shim"
            {
              echo '#!/usr/bin/env bash'
              echo 'exec python "$@"'
            } > "$shim/python3"
            chmod +x "$shim/python3"
            cygpath -w "$shim" >> "$GITHUB_PATH"
          fi
      - name: Configure git identity
        run: |
          git config --global user.name  "CI"
          git config --global user.email "ci@example.com"
      - name: Install and uninstall tests (macOS uses /bin/bash 3.2)
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Put the system bash first so `#!/usr/bin/env bash` resolves to 3.2 as it does
            # for most macOS users, even when the image also ships a newer bash.
            mkdir -p "$RUNNER_TEMP/system-bash"
            ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
            export PATH="$RUNNER_TEMP/system-bash:$PATH"
          fi
          bash --version | head -n 1
          bash tests/install.sh
      - name: worktree-cycle, step-back and shrink-test-input suites (macOS uses /bin/bash 3.2)
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p "$RUNNER_TEMP/system-bash"
            ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
            export PATH="$RUNNER_TEMP/system-bash:$PATH"
          fi
          bash skills/worktree-cycle/tests/run.sh
          bash skills/step-back/tests/run.sh
          bash skills/shrink-test-input/tests/run.sh
      - name: Provide bash 4+ for peer-review on macOS
        if: runner.os == 'macOS'
        run: |
          # run-peer-review.sh needs associative arrays and says so on bash 3.2.
          if ! bash -c '[ "${BASH_VERSINFO[0]}" -ge 4 ]'; then
            brew install bash
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
      - name: peer-review suite
        run: |
          bash --version | head -n 1
          bash skills/peer-review/tests/run.sh
      - name: agent-memory suite
        run: bash skills/agent-memory/tests/run.sh
        env:
          AGENT_MEMORY_TEST_VENV: ${{ runner.temp }}/agent-memory-test-venv

  split:
    needs: [quality, portability]
    # Only main publishes: a manual run from another branch must not overwrite split/*.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One split at a time across every trigger; a queued run is never cancelled mid-push.
    concurrency:
      group: split-skills-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Choose the skills to split
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: |
          # A push splits the skills its range changed, plus any skill whose
          # published split branch does not match skills/<name> at this commit
          # (an earlier run that failed or was skipped). A manual run, a
          # force-push, or a range git cannot diff splits every skill: a
          # rewritten history can change a split branch without changing a file.
          set -euo pipefail
          shopt -s nullglob
          git fetch --quiet --no-tags origin '+refs/heads/split/*:refs/remotes/origin/split/*' || true
          all=0
          if [ "$EVENT" != "push" ] || [ "$FORCED" = "true" ] \
             || [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ] \
             || ! git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA" 2>/dev/null; then
            all=1
          fi
          changed=""
          [ "$all" = "1" ] || changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- skills/ | cut -d/ -f2 | sort -u)"
          names=()
          for dir in skills/*/; do
            name="$(basename "$dir")"
            published="$(git rev-parse --quiet --verify "refs/remotes/origin/split/$name^{tree}" 2>/dev/null || true)"
            current="$(git rev-parse --quiet --verify "$GITHUB_SHA:skills/$name" 2>/dev/null || true)"
            if [ "$all" = "1" ] || [ "$published" != "$current" ] || printf '%s\n' "$changed" | grep -Fxq "$name"; then
              names+=("$name")
            fi
          done
          echo "skills=${names[*]}" >> "$GITHUB_OUTPUT"
          echo "splitting: ${names[*]:-(none)}"

      - name: Split each chosen skill into split/<name>
        if: steps.pick.outputs.skills != ''
        env:
          SKILLS: ${{ steps.pick.outputs.skills }}
        run: |
          # NB: no `set -e` — one skill's split/push failure must NOT abort the
          # rest of the matrix. Failures are collected and reported at the end so
          # the remaining skills still get republished on this run.
          set -uo pipefail
          failed=()
          for name in $SKILLS; do
            branch="split/$name"
            echo "::group::$name"
            # subtree split rebuilds history of skills/<name>/ as if that
            # dir had always been the repo root. -b creates/updates a local
            # branch ref at the synthesized tip.
            if git subtree split --prefix="skills/$name" -b "$branch" \
               && git push --force origin "$branch"; then
              git branch -D "$branch" 2>/dev/null || true
            else
              echo "::error::failed to split/push $branch"
              failed+=("$name")
              git branch -D "$branch" 2>/dev/null || true
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::split failed for: ${failed[*]}"
            exit 1
          fi
