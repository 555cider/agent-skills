name: split-skills

# Each directory under skills/ is published as its own branch named
# split/<skill-name>, containing only that skill's history. install.sh clones
# that split branch for normal installs; before a new split branch exists, it
# can sync the local skills/<name>/ checkout for maintainer testing.
#
# This workflow runs `git subtree split` for every skill on every push to
# main that touches skills/, and force-pushes the result. The split
# branches are derived artifacts — never commit to them directly.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'install.sh'
      - 'uninstall.sh'
      - '.github/workflows/split.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'install.sh'
      - 'uninstall.sh'
      - '.github/workflows/split.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: split-skills
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Installer migration coverage reconstructs the final ui-splint tree
          # from the commit immediately before its deletion.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Agent Skills validator
        run: python -m pip install 'skills-ref==0.1.1'
      - name: Validate skill packages and eval assets
        run: |
          set -euo pipefail
          for skill in skills/*; do
            agentskills validate "$skill"
          done
          python3 tests/validate-skill-evals.py
      - name: Run deterministic regression suites
        run: |
          set -euo pipefail
          for suite in skills/*/tests/run.sh; do
            bash "$suite"
          done
          bash tests/install.sh

  split:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Split each skill into split/<name>
        run: |
          # NB: no `set -e` — one skill's split/push failure must NOT abort the
          # rest of the matrix. Failures are collected and reported at the end so
          # the remaining skills still get republished on this run.
          set -uo pipefail
          shopt -s nullglob
          failed=()
          for dir in skills/*/; do
            name="$(basename "$dir")"
            branch="split/$name"
            echo "::group::$name"
            # subtree split rebuilds history of skills/<name>/ as if that
            # dir had always been the repo root. -b creates/updates a local
            # branch ref at the synthesized tip.
            if git subtree split --prefix="skills/$name" -b "$branch" \
               && git push --force origin "$branch"; then
              git branch -D "$branch" 2>/dev/null || true
            else
              echo "::error::failed to split/push $branch"
              failed+=("$name")
              git branch -D "$branch" 2>/dev/null || true
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::split failed for: ${failed[*]}"
            exit 1
          fi

          # ui-splint was fully renamed to ui-audit. Remove the legacy branch
          # only after every current split push succeeded and the replacement
          # branch is visible remotely, so a publication failure never strands
          # existing users without either branch.
          if git ls-remote --exit-code --heads origin split/ui-audit >/dev/null 2>&1; then
            if git ls-remote --exit-code --heads origin split/ui-splint >/dev/null 2>&1; then
              git push origin --delete split/ui-splint
            fi
          else
            echo "::error::split/ui-audit was not published; refusing to delete split/ui-splint"
            exit 1
          fi
