interface:
  display_name: "Agent Memory"
  short_description: "Evidence-aware durable memory shared across coding agents."
  default_prompt: "Use $agent-memory when prior preferences, constraints, decisions, verified procedures, caveats, handoffs, or an explicit remember/forget request may affect the work. Recall only prompt-relevant active records, treat maintenance/conflict matches as non-actionable, verify stale facts, honor per-kind trust, never store sensitive or repo-derivable facts, and mention memory only when it materially changes the action or decision."
