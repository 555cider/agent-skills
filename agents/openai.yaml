interface:
  display_name: "Worktree Cycle"
  short_description: "Start a git worktree from the local integration branch and land it back the repository's way."
  default_prompt: "Use $worktree-cycle to start or finish isolated work in a git worktree. Start with scripts/start-worktree.sh, which branches from the local integration branch HEAD (default: the main worktree's branch), asserts that base, and reserves a dev-server port block; run only the stack you change on those ports and never restart a server you did not start. When the work is verified, report from the worktree and ask the user whether to land it on base; do not finish on your own. Once approved, return to the main worktree as its own step, then finish with scripts/finish-worktree.sh using the repository's strategy (--strategy squash|merge|ff|pr, or git config worktree-cycle.strategy) and remove the branch and worktree. In a pull-request repository, push the branch and open the PR only when the user approves, and run finish --strategy pr after the server merged it. Report cleanup exactly as it happened and never push."
