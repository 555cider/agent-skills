interface:
  display_name: "DOM Picker"
  short_description: "Turn a UI element selected in a running web app into a minimal, validated frontend diff."
  default_prompt: "Use $dom-picker when the user points at or selects a specific on-screen element in a running web app and wants it fixed, and browser automation plus repo access are available. Inject the picker, collect DOM/style/screenshot context, rank source-file candidates, and return or apply a validated unified diff. Apply without a second approval only for authorized high-confidence safe-scope fixes; never auto-apply low-confidence changes."
