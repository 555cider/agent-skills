<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>focus indicator</title>
<style>
  body{margin:0;padding:40px;display:grid;gap:20px;background:#fff;color:#111;font:16px system-ui}
  button,input{width:240px;min-height:44px;background:#fff;color:#111;border:1px solid #333}
  #bad-focus:focus,#bad-focus:focus-visible{outline:none;box-shadow:none}
  #good-focus:focus-visible{outline:3px solid #111;outline-offset:2px}
  #low-focus:focus-visible{outline:3px solid #b5b5b5;outline-offset:2px}
  #complex-focus:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(0,90,255,.55)}
</style></head><body>
  <button id="entry">Entry</button>
  <button id="bad-focus">Missing focus indicator</button>
  <button id="good-focus">Strong focus indicator</button>
  <button id="low-focus">Low contrast focus indicator</button>
  <button id="complex-focus">Complex focus indicator</button>
  <label for="caret">Caret field</label><input id="caret" value="editable">
</body></html>
