<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Working modal focus trap</title>
<style>
  *{box-sizing:border-box} body{margin:0;padding:24px;font:16px system-ui;color:#111827;background:#fff}
  button{min-width:120px;min-height:44px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font:inherit}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5)}
  .dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:320px;padding:24px;background:#fff;border-radius:12px}
  .dialog-actions{display:flex;gap:12px}
</style></head><body>
  <button id="background-action">Background action</button>
  <div class="backdrop"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
    <h1 id="title">Confirm change</h1>
    <p>The background remains focusable in the DOM, but trusted Tab input is trapped.</p>
    <div class="dialog-actions"><button id="cancel">Cancel</button><button id="confirm">Confirm</button></div>
  </div>
  <script>
    const dialog = document.querySelector('.dialog');
    const stops = [...dialog.querySelectorAll('button')];
    stops[0].focus();
    document.addEventListener('keydown', event => {
      if (event.key !== 'Tab') return;
      if (event.shiftKey && document.activeElement === stops[0]) {
        event.preventDefault(); stops[stops.length - 1].focus();
      } else if (!event.shiftKey && document.activeElement === stops[stops.length - 1]) {
        event.preventDefault(); stops[0].focus();
      }
    });
  </script>
</body></html>
