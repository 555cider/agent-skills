<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>whitelist</title></head>
<body style="background:#ffffff;margin:0;padding:16px">
  <!-- Three low-contrast controls that share class .wl (two buttons + a span inside a .wl box),
       plus one .other control. A whitelist of .wl must suppress ALL three, not just the first. -->
  <button class="wl" style="color:#eeeeee;background:#ffffff;display:block;width:100%;height:48px">one</button>
  <button class="wl" style="color:#eeeeee;background:#ffffff;display:block;width:100%;height:48px">two</button>
  <div class="wl"><span style="color:#eeeeee;background:#ffffff">child text</span></div>
  <button class="other" style="color:#eeeeee;background:#ffffff;display:block;width:100%;height:48px">keep</button>
</body>
</html>
