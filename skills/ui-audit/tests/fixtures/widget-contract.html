<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget contract violations</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:24px;font:16px/1.5 system-ui;color:#111827;background:#fff}
  h1{font-size:22px;margin:0 0 16px}
  h2{font-size:17px;margin:24px 0 8px}
  section{margin-bottom:8px}
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  button{min-height:32px;min-width:64px;padding:6px 14px;border:1px solid #1d4ed8;border-radius:8px;background:#1d4ed8;color:#fff;font:inherit}
  button:hover{background:#1e40af;border-color:#1e40af}
  input[type=text],input[type=email]{min-height:32px;padding:6px 10px;border:1px solid #6b7280;border-radius:6px;background:#fff;color:#111827;font:inherit;width:260px}
  label{display:block;margin-bottom:4px}
  /* W1: a 7-tab strip in a container too narrow to hold one row */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;width:340px;padding:4px;border:1px solid #d1d5db;border-radius:8px}
  .tabs [role=tab]{min-height:32px;padding:6px 12px;border:1px solid #6b7280;border-radius:6px;background:#f3f4f6;color:#111827}
  .tabs [role=tab]:hover{background:#e5e7eb;border-color:#374151}
  .tabs [role=tab][aria-selected=true]{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
  .tabs [role=tab][aria-selected=true]:hover{background:#1e40af;border-color:#1e40af}
  /* W6: navigation that exists only behind the disclosure button */
  #site-nav{display:none}
  .switch{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px;border:1px solid #6b7280;border-radius:999px;background:#f3f4f6;color:#111827}
</style></head><body>
  <div class="bar">
    <!-- W6 desktopHiddenNav: top-level navigation hidden behind a hamburger on desktop -->
    <button id="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="Menu">☰ Menu</button>
    <h1>Account settings</h1>
  </div>
  <nav id="site-nav" aria-label="Primary">
    <a href="/overview">Overview</a>
    <a href="/billing">Billing</a>
    <a href="/team">Team</a>
    <a href="/security">Security</a>
  </nav>

  <h2>W1 — tab strip wraps to two rows</h2>
  <div class="tabs" role="tablist" aria-label="Settings sections">
    <button role="tab" aria-selected="true" id="t1">Profile</button>
    <button role="tab" aria-selected="false" id="t2">Billing</button>
    <button role="tab" aria-selected="false" id="t3">Security</button>
    <button role="tab" aria-selected="false" id="t4">Notifications</button>
    <button role="tab" aria-selected="false" id="t5">Integrations</button>
    <button role="tab" aria-selected="false" id="t6">Audit log</button>
    <button role="tab" aria-selected="false" id="t7">Danger zone</button>
  </div>
  <div role="tabpanel" aria-labelledby="t1"><p>Profile settings panel.</p></div>

  <h2>W2 — placeholder is the only visible label</h2>
  <form id="contact">
    <input type="email" aria-label="Work email" placeholder="Work email">
    <button type="button">Verify</button>
  </form>

  <h2>W3 — a radio button with no group</h2>
  <p><input type="radio" id="agree" name="agree-terms"> <label for="agree">Send me product updates</label></p>

  <h2>W4 — toggle inside a form that commits on Save</h2>
  <form id="prefs">
    <span class="switch">
      <span id="wd-label">Weekly digest</span>
      <button type="button" role="switch" aria-checked="false" aria-labelledby="wd-label" id="weekly-digest">Off</button>
    </span>
    <p><button type="submit">Save changes</button></p>
  </form>

  <h2>W5 — invalid field with no error text</h2>
  <form id="rename">
    <label for="workspace">Workspace name</label>
    <input type="text" id="workspace" aria-invalid="true" value="  ">
    <p><button type="submit">Rename</button></p>
  </form>
</body></html>
