interface:
  display_name: "UI Splint"
  short_description: "Find frontend layout, composition, contrast, affordance, state, data-feedback, responsive, overflow, form, chart, and layering issues before completion."
  default_prompt: "Use $ui-splint to inspect rendered frontend UI before calling the work complete. Check page-level composition, grouping and scan path, alignment, spacing, shared-component consistency, table sizing, text overflow, contrast on real surfaces, selected-state clarity, form/input readability and validation, auth/navigation mode conflicts, clickable affordance, focus and pending states, duplicate actions, crowded touch targets, popover clipping, scroll/sticky/layering problems, mobile safe areas, ancestor-driven collapsed/clipped/mispositioned regions, empty-vs-error and stale/partial data feedback, charts/metrics, responsive behavior, and dynamic loading/empty/error states."
