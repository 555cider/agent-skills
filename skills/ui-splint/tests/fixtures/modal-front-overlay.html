<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Modal front overlay fixture</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      color: #111827;
    }
    .dialog {
      position: fixed;
      z-index: 100;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      min-height: 180px;
      padding: 24px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
    }
    .front-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Account settings</h1>
    <button>Background action</button>
  </main>
  <div class="dialog" role="dialog" aria-modal="true">
    <h2>Confirm change</h2>
    <p>This dialog has no backdrop behind it.</p>
  </div>
  <div class="front-overlay" aria-hidden="true"></div>
</body>
</html>
