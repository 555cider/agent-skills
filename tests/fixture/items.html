<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>상품 목록</title></head>
<body>
  <header><nav aria-label="주요"><a href="/">홈</a></nav></header>
  <main>
    <h1>상품 목록</h1>
    <button id="filter" type="button">필터</button>
    <ul>
      <li><a href="/items/1">상품 보기</a></li>
      <li><a href="/items/2">상품 보기</a></li>
      <li><a href="/items/3">상품 보기</a></li>
      <li><a href="/items/4">상품 보기</a></li>
      <li><a href="/items/5">상품 보기</a></li>
    </ul>
    <!-- The label is *words*, not a badge count, so dropping numeric tokens cannot
         save the action key: it changes between visits and the key stops matching.
         Only the recorded CSS position can still find this link, which is exactly
         the case `fallbackUsed` exists to report. -->
    <p><a href="/cart" id="stash">보관함 {{STASH}}</a></p>
  </main>
  <dialog id="dlg" aria-label="필터">
    <h2>필터</h2>
    <button id="close" type="button">닫기</button>
  </dialog>
  <script>
    document.getElementById('filter').addEventListener('click', () => document.getElementById('dlg').showModal());
    document.getElementById('close').addEventListener('click', () => document.getElementById('dlg').close());
  </script>
</body>
</html>
