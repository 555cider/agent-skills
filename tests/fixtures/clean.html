<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0d0f12;color:#f3f4f6;font-family:system-ui,sans-serif;padding:20px;max-width:480px;margin:0 auto}
  h1{font-size:22px;margin:24px 4px 20px}
  .seg{display:flex;gap:8px;margin-bottom:20px;background:#1a1d23;padding:4px;border-radius:14px}
  .seg button{flex:1;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;min-height:48px;background:transparent;color:#cbd1da}
  .seg button[aria-selected=true]{background:#1d4ed8;color:#ffffff}
  .oauth{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid #2a2f37;border-radius:12px;padding:14px;margin-bottom:12px;font-size:16px;font-weight:600;min-height:52px;cursor:pointer;background:#1a1d23;color:#f3f4f6}
  .field{display:block;width:100%;border:1px solid #6f7a89;border-radius:12px;background:#15181d;padding:16px;margin-bottom:12px;font-size:16px;color:#f3f4f6;min-height:52px}
  .field::placeholder{color:#9aa3b2}
  .submit{display:block;width:100%;border:0;border-radius:12px;padding:16px;margin-top:8px;font-size:16px;font-weight:700;background:#1d4ed8;color:#ffffff;min-height:52px;cursor:pointer}
  .muted{color:#aeb6c2;font-size:13px;text-align:center;margin-top:16px}
</style></head>
<body>
  <h1>다시 오신 걸 환영해요</h1>
  <div class="seg" role="tablist">
    <button role="tab" aria-selected="true">로그인</button>
    <button role="tab" aria-selected="false">회원가입</button>
  </div>
  <button class="oauth">Google로 계속하기</button>
  <button class="oauth">이메일로 계속하기</button>
  <input class="field" aria-label="이메일 주소" placeholder="이메일 주소">
  <input class="field" type="password" aria-label="비밀번호" placeholder="비밀번호">
  <button class="submit">로그인</button>
  <p class="muted">계속 진행하면 이용약관에 동의하게 됩니다.</p>
</body></html>
