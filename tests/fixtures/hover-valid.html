<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valid hover feedback</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:32px;background:#fff;color:#17202a;font:16px/1.5 system-ui,sans-serif}
  .toolbar{display:flex;align-items:center;gap:16px}
  button,a{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:48px;padding:10px 16px;border:2px solid #23466d;border-radius:8px;background:#fff;color:#173b63;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
  #background-hover:hover{background:#d9e9f8}
  #underline-hover:hover{text-decoration:underline 3px}
  #icon-hover .icon{display:inline-block;margin-right:8px;transition:transform 40ms linear}
  #icon-hover:hover .icon{transform:translateY(-3px)}
  .tip{display:none;position:absolute;top:52px;left:0;width:150px;padding:8px;background:#17202a;color:#fff;border-radius:4px;font-size:12px}
  #tooltip-hover:hover .tip{display:block}
</style></head>
<body>
  <div class="toolbar" role="toolbar" aria-label="Document actions">
    <button id="background-hover" type="button">Background</button>
    <a id="underline-hover" href="#details">Details</a>
    <button id="icon-hover" type="button"><span class="icon" aria-hidden="true">◆</span>Move icon</button>
    <button id="tooltip-hover" type="button" aria-describedby="hover-tip">Help<span id="hover-tip" class="tip" role="tooltip">More information</span></button>
  </div>
</body></html>
