<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모달 액션 도달성</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:24px;font:16px/1.6 system-ui;color:#111827;background:#fff}
  h1{font-size:22px;margin:0 0 12px}
  .backdrop{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:10}
  .dlg{position:fixed;top:80px;left:50%;transform:translateX(-50%);width:520px;height:320px;
       display:flex;flex-direction:column;background:#fff;border:1px solid #d1d5db;border-radius:12px;z-index:20}
  .dlg h2{font-size:18px;margin:0;padding:16px;border-bottom:1px solid #e5e7eb}
  /* 결함: 액션 버튼이 스크롤되는 본문 안에 들어 있어 열린 순간에는 보이지 않는다 */
  .dlg-body{flex:1;min-height:0;overflow-y:auto;padding:16px}
  .dlg-body p{margin:0 0 12px}
  .dlg-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:8px}
  .dlg-actions button{min-height:36px;padding:8px 16px;border-radius:6px;font:inherit}
  .primary{border:1px solid #1d4ed8;background:#1d4ed8;color:#fff}
  .primary:hover{background:#1e40af;border-color:#1e40af}
  .ghost{border:1px solid #6b7280;background:#fff;color:#111827}
  .ghost:hover{background:#e5e7eb;border-color:#374151}
</style></head><body>
<main>
  <h1>서비스 이용 동의</h1>
  <p>동의 절차를 마쳐야 신청을 계속할 수 있습니다.</p>
</main>
<div class="backdrop"></div>
<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
  <h2 id="dlg-title">약관 동의</h2>
  <div class="dlg-body">
    <p>제1조 이 약관은 서비스 이용에 관한 기본 사항을 정합니다.</p>
    <p>제2조 이용자는 본인의 정보를 정확하게 입력하여야 합니다.</p>
    <p>제3조 기관은 수집한 정보를 신청 처리 목적으로만 사용합니다.</p>
    <p>제4조 이용자는 언제든지 자신의 정보 열람을 요청할 수 있습니다.</p>
    <p>제5조 기관은 보관 기간이 지난 정보를 지체 없이 파기합니다.</p>
    <p>제6조 서비스 점검 시 이용이 일시적으로 제한될 수 있습니다.</p>
    <p>제7조 이 약관의 변경 사항은 시행 7일 전에 공지합니다.</p>
    <div class="dlg-actions">
      <button type="button" class="ghost">취소</button>
      <button type="button" class="primary">동의하고 계속</button>
    </div>
  </div>
</div>
<script>
  // Escape 로 닫히는 것은 별개 계약이므로 여기서는 지킨다.
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    var dialog = document.querySelector('.dlg');
    var backdrop = document.querySelector('.backdrop');
    if (dialog) dialog.style.display = 'none';
    if (backdrop) backdrop.style.display = 'none';
  });
</script>
</body></html>
